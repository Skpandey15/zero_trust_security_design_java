// Backend track - WP-BE-01, WP-BE-02, WP-BE-03.
// See backend/README.md for the mapping from modules to work packages and ADRs.

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'

    // Security pins. Boot 4.1.1 is the latest release and still manages tomcat 11.0.24
    // (three CRITICAL CVEs, fixed in 11.0.25) and jackson 3.1.5 (HIGH, fixed in 3.1.6),
    // which the pipeline's image scan flagged. Remove each override once Boot's own
    // managed version reaches it.
    ext['tomcat.version'] = '11.0.25'
    ext['jackson-bom.version'] = '3.1.6'


    group = 'com.example.zerotrust'
    version = '0.1.0-SNAPSHOT'

    java {
        toolchain {
            // Java 27 (15 Sep 2026) - latest release. NOT an LTS: 25 is the
            // current LTS and 29 is next. Chosen because JEP 527 brings
            // post-quantum hybrid key exchange for TLS 1.3 into the platform,
            // which is the TLS half of ADR-SEC-021. Revert to of(25) if a
            // support window matters more.
            languageVersion = JavaLanguageVersion.of(27)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
