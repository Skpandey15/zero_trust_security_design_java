# WP-UI-01. The browser trust boundary (ADR-SEC-007). Stateless because the
# session lives in Redis, which is what lets it run as two replicas.
apiVersion: v1
kind: Service
metadata:
  name: bff
  labels: { app.kubernetes.io/name: bff }
spec:
  selector: { app.kubernetes.io/name: bff }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels: { app.kubernetes.io/name: bff }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: bff }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bff }
    spec:
      serviceAccountName: bff
      enableServiceLinks: false   # the injected REDIS_PORT=tcp://... would shadow app config
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: bff }
      initContainers:
        # The issuer is served over TLS from a private CA. Rather than disable
        # verification, extend the JVM trust store with that one CA.
        - name: trust-private-ca
          image: zero-trust/bff:__TAG__
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              cp "$JAVA_HOME/lib/security/cacerts" /trust/cacerts &&
              chmod u+w /trust/cacerts &&
              keytool -importcert -noprompt -alias zero-trust-ca
              -file /ca/ca.crt -keystore /trust/cacerts -storepass changeit
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: trust, mountPath: /trust }
            - { name: ca, mountPath: /ca, readOnly: true }
      containers:
        - name: bff
          image: zero-trust/bff:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
            - name: AUTH_ISSUER
              valueFrom: { configMapKeyRef: { name: platform-config, key: issuer } }
            - { name: API_BASE_URL, value: "http://resource-server:9100" }
            - { name: REDIS_HOST, value: redis }
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: zt-redis, key: password } }
            - name: OAUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: zt-oidc, key: bff-client-secret } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 640Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: trust, mountPath: /trust, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: trust, emptyDir: {} }
        - name: ca
          secret:
            secretName: zt-edge-tls
            # Only the CA certificate. The same secret holds the TLS private
            # key, which this pod has no business seeing.
            items: [{ key: ca.crt, path: ca.crt }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bff }
