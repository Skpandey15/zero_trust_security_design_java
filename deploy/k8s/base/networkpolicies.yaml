# Default deny, then one explicit allow per real dependency (ADR-SEC-001: a
# namespace is not a trust boundary). Enforced by the CNI - k3s ships the
# kube-router network policy controller.
#
# The call graph these policies encode:
#
#   ingress(traefik) -> frontend, bff, authorization-server
#   bff              -> authorization-server, resource-server, redis, edge (issuer over TLS)
#   resource-server  -> authorization-server            (JWKS only)
#   authorization-server -> postgres
#
# Anything not drawn above is denied, including pod-to-pod traffic inside the
# namespace and every egress to the wider network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# ---- ingress controller -> workloads ------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-from-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: bff }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorization-server-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: authorization-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: bff }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: resource-server }
      ports: [{ protocol: TCP, port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resource-server-from-bff
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: resource-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: bff }
      ports: [{ protocol: TCP, port: 9100 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-authorization-server
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: authorization-server }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-bff
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: bff }
      ports: [{ protocol: TCP, port: 6379 }]
---
# ---- egress ---------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: bff }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: authorization-server } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: resource-server } }
      ports: [{ protocol: TCP, port: 9100 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
      ports: [{ protocol: TCP, port: 6379 }]
    # OIDC discovery and the token exchange go to the public issuer URL, which
    # resolves in-cluster to the ingress controller's TLS port.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports: [{ protocol: TCP, port: 8443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resource-server-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: resource-server }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: authorization-server } }
      ports: [{ protocol: TCP, port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorization-server-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: authorization-server }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
