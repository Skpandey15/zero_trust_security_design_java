# WP-BE-02. Stateless, so it scales and rolls without ceremony. It reaches the
# Authorization Server only for the JWKS document; it never sees a credential.
apiVersion: v1
kind: Service
metadata:
  name: resource-server
  labels: { app.kubernetes.io/name: resource-server }
spec:
  selector: { app.kubernetes.io/name: resource-server }
  ports:
    - { name: http, port: 9100, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-server
  labels: { app.kubernetes.io/name: resource-server }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: resource-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: resource-server }
    spec:
      serviceAccountName: resource-server
      enableServiceLinks: false   # the injected REDIS_PORT=tcp://... would shadow app config
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: resource-server }
      containers:
        - name: resource-server
          image: zero-trust/resource-server:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 9100 }
          env:
            # The issuer is the PUBLIC one: it is what the token's iss claim
            # carries, so it is what must be validated. Keys are fetched over
            # the cluster-internal address.
            - name: AUTH_ISSUER
              valueFrom: { configMapKeyRef: { name: platform-config, key: issuer } }
            - { name: JWK_SET_URI, value: "http://authorization-server:9000/oauth2/jwks" }
            # A DEDICATED database role (ADR-SEC-019): owns only its own schema and can read
            # tenant membership, nothing else of the identity database. Created by
            # deploy/scripts/bootstrap-db.sh; the pipeline cannot grant itself database rights.
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/authdb?currentSchema=app" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: zt-resource-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: zt-resource-db, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 640Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: resource-server
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: resource-server }
