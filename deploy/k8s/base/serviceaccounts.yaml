# One ServiceAccount per workload, none of them mounting an API token: no
# service here talks to the Kubernetes API, so none should hold a credential
# for it. (ADR-SEC-018 - workload identity is per workload, not per namespace.)
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: bff }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: authorization-server }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: resource-server }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: postgres }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: redis }
automountServiceAccountToken: false
