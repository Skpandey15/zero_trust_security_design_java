# Admission control for the zero-trust namespace (ADR-SEC-022).
#
# Pod Security Admission (namespace labels) already blocks privileged and
# root workloads. This adds what PSA cannot express: which images may run, and
# that nothing runs unbounded. Native ValidatingAdmissionPolicy - no webhook,
# no extra component to keep alive.
#
# NOT yet here: signature verification (Cosign). It needs a verifying
# controller and a signing step in CI; see deploy/README.md.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zt-workload-baseline
spec:
  failurePolicy: Fail          # fail closed: if the policy cannot be evaluated, deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "variables.containers.all(c, c.image.contains(':') || c.image.contains('@sha256:'))"
      message: "every image must carry an explicit tag or digest"
    - expression: "variables.containers.all(c, !c.image.endsWith(':latest'))"
      message: "the :latest tag is not allowed - tags must be immutable enough to roll back to"
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('zero-trust/') ||
          c.image.startsWith('localhost:30500/zero-trust/') ||
          c.image.startsWith('postgres:') ||
          c.image.startsWith('redis:'))
      message: "image is not from an allowed source"
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "every container must set a memory limit"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: "hostNetwork is not allowed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zt-workload-baseline
spec:
  policyName: zt-workload-baseline
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: zero-trust }
