# Edge certificate, issued by the local CA in ../../cluster/k3d/pki.yaml.
# In production this is the same object pointed at a real issuer (ACME or an
# enterprise CA); nothing else changes.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zt-edge
spec:
  secretName: zt-edge-tls
  duration: 2160h      # 90 days
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  dnsNames:
    - zerotrust.localtest.me
    - auth.zerotrust.localtest.me
  issuerRef:
    kind: ClusterIssuer
    name: zt-local-ca
