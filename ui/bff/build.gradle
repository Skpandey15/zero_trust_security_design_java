// WP-UI-01 - Backend For Frontend.
// Owns the browser trust boundary: session cookies, CSRF, CORS, CSP, the OAuth
// client, PKCE orchestration and API forwarding.
// ADRs: SEC-003 (PKCE), SEC-007 (browser token custody), SEC-011 (sessions)

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.zerotrust'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Confidential OAuth client: the BFF holds the credentials, not the browser.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Session state must be shared across replicas, or the BFF cannot scale
    // horizontally (design document §27.8). Redis-backed sessions, enabled by
    // profile; the default profile uses in-memory sessions for local work.
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
